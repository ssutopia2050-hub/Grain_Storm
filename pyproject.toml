[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grain-storm"
version = "0.1.0"
description = "A generalized agricultural monitoring and geospatial data analysis framework"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4.0",
    "requests>=2.31,<3.0",
    "matplotlib>=3.9,<4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
